<!DOCTYPE html>
<html lang="en">
<head>

<title>Turbo Rush</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>

html,body{height:100%;margin:0;overflow:hidden;font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);background:#8fd0ff;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.card{background:var(--card);border-radius:18px;padding:8px 14px;box-shadow:0 4px 14px rgba(0,0,0,.2);backdrop-filter:blur(6px)}
#hud{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 8px);display:none;justify-content:space-between;align-items:flex-start;pointer-events:none}
#pos{font-size:38px;font-weight:800;line-height:1}#sub{font-size:14px}
#mm{width:96px;height:96px;border-radius:50%;background:var(--card)}
#spd{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);font-size:26px;font-weight:800;display:none;text-shadow:0 2px 6px rgba(0,0,0,.35);color:#fff}
#msg{position:fixed;left:0;right:0;top:34%;text-align:center;font-size:84px;font-weight:800;color:#fff;text-shadow:0 5px 18px rgba(0,0,0,.5);pointer-events:none}
#toast{position:fixed;left:0;right:0;top:22%;text-align:center;font-size:24px;font-weight:800;color:#fff;text-shadow:0 3px 10px rgba(0,0,0,.5);pointer-events:none;opacity:0;transition:opacity .3s}
#ctl{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:none;justify-content:space-between;padding:0 16px;pointer-events:none}
#ctl div{pointer-events:auto;display:flex;gap:12px}
.b{width:72px;height:72px;border-radius:50%;border:0;font-size:30px;background:rgba(255,255,255,.75);box-shadow:0 5px 0 rgba(0,0,0,.25);color:#14213d;display:flex;align-items:center;justify-content:center}
.b.big{width:86px;height:86px;font-size:38px;background:var(--ac)}
.b:active{transform:translateY(3px)}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,20,50,.35);backdrop-filter:blur(3px);overflow:auto}
#ov .card{text-align:center;padding:20px 22px;width:min(340px,88vw);max-height:86vh;overflow:auto}
h1{margin:0;font-size:42px;line-height:1}h2{margin:0 0 8px}
p{margin:6px 0;font-size:15px}.sm{font-size:12px;opacity:.75}
button.m{font:inherit;font-weight:800;font-size:19px;border:0;border-radius:99px;padding:9px 22px;margin:5px 3px;color:#fff;background:#2f7bff;box-shadow:0 5px 0 #1a4fb8}
button.m.o{background:var(--ac);box-shadow:0 5px 0 #b33a1e}button.m.g{background:#8893aa;box-shadow:0 5px 0 #5d667a}
button.m:active{transform:translateY(3px)}
input{font:inherit;font-size:18px;padding:8px 12px;border-radius:12px;border:2px solid #9ab;width:80%;text-align:center}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid rgba(128,128,128,.25);font-size:15px}
.sw{width:22px;height:22px;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:6px}
#ov .card{max-height:72vh;margin-bottom:64px}
#ov.bot{align-items:flex-end;background:none;backdrop-filter:none;pointer-events:none}#ov.bot .card{pointer-events:auto;margin-bottom:70px}
#nav{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;justify-content:center;gap:8px;pointer-events:auto}
#nav button{font:inherit;font-weight:800;font-size:16px;border:0;border-radius:99px;padding:9px 16px;background:var(--card);color:var(--ink);box-shadow:0 4px 12px rgba(0,0,0,.25)}
#nav button.on{background:var(--ac);color:#fff}
.gh{display:flex;align-items:center;justify-content:space-between;gap:6px}.gh h2{margin:0}.gh .m{padding:4px 14px;margin:0}
.st{display:flex;align-items:center;gap:8px;font-size:13px;margin:3px 0}.st span{width:64px;text-align:left}.st i{flex:1;height:9px;border-radius:9px;background:rgba(128,128,128,.3);overflow:hidden}.st b{display:block;height:100%;background:linear-gradient(90deg,#2f7bff,#19d8ff)}
</style>
</head>

<canvas id="c"></canvas>
<div id="hud"><div class="card"><div id="pos">1/6</div><div id="sub"></div></div><button class="b" id="pz" style="width:46px;height:46px;font-size:18px;pointer-events:auto" onclick="pause()">⏸</button><canvas id="mm" width="192" height="192"></canvas></div>
<div id="spd"></div><div id="msg"></div><div id="toast"></div>
<div id="ctl"><div><button class="b" id="bl">◀</button><button class="b" id="br">▶</button></div><div><button class="b big" id="bi">—</button></div></div>
<div id="ov"><div class="card" id="scr"></div><div id="nav"><button data-t="h" onclick="go('h')">🏠 Home</button><button data-t="g" onclick="go('g')">🚗 Garage</button><button data-t="p" onclick="go('p')">🏁 Play</button></div></div>

 {n:'Space Station',laps:3,ai:1.08,seed:29,K:10,r0:125,rv:60,top:0x000006,hor:0x1a1a4a,grass:0x0d1020,hill:0x1a1a3a,road:'#20243a',stars:1,neon:0xff3df0,bl:1,grip:.9,deco:[{k:'ico',c:0x6a7088,n:110,s:[1,3],fly:1},{k:'ico',c:0x19d8ff,e:0x19d8ff,n:60,s:[.6,1.6]}]}];

// ---- renderer
const cv=$('c'),ren=new THREE.WebGLRenderer({canvas:cv,antialias:true});

const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(sp0,3));
const starsM=new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:2.6,sizeAttenuation:false,fog:false}));scene.add(starsM);

// ---- particles
const NP=700,pp=new Float32Array(NP*3).fill(-100),pv=new Float32Array(NP*3),pc=new Float32Array(NP*3),pc0=new Float32Array(NP*3),pl=new Float32Array(NP);
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pp,3));pg.setAttribute('color',new THREE.BufferAttribute(pc,3));
const parts=new THREE.Points(pg,new THREE.PointsMaterial({size:.7,vertexColors:true,depthWrite:false}));parts.frustumCulled=false;scene.add(parts);
let pn=0;
function emit(x,y,z,col,n,sp,up){const c=new THREE.Color(col);for(let k=0;k<n;k++){const i=pn++%NP,a=Math.random()*6.283,s=Math.random()*sp;

 if(pp[j+1]<.1){pp[j+1]=.1;pv[j+1]*=-.3}const f=Math.max(0,pl[i]);pc[j]=pc0[j]*f;pc[j+1]=pc0[j+1]*f;pc[j+2]=pc0[j+2]*f;if(pl[i]<=0)pp[j+1]=-100}}

// ---- track

let world,P=[],T=[],Nm=[],seg=1,LC=LV[0],boxes=[],tmpv=new THREE.Vector3();

const GEO={cone:()=>new THREE.ConeGeometry(2.2,6,8),cyl:()=>new THREE.CylinderGeometry(.5,.7,7,8),ico:()=>new THREE.IcosahedronGeometry(2,1),sph:()=>new THREE.SphereGeometry(2.6,14,10),box:()=>new THREE.BoxGeometry(5,1,5)},GY={cone:3,cyl:3.5,ico:1.2,sph:2.2,box:.5};

 else{const cb=tex(16,32,(c,w,h)=>{c.fillStyle='#e63946';c.fillRect(0,0,w,h);c.fillStyle='#fff';c.fillRect(0,h/2,w,h/2)}),cm=new THREE.MeshStandardMaterial({map:cb,roughness:.6,side:THREE.DoubleSide});ribbon(-W/2-1.3,-W/2,.05,cm,2.6);ribbon(W/2,W/2+1.3,.05,cm,2.6)}
 const sl=new THREE.Mesh(new THREE.PlaneGeometry(W,3),new THREE.MeshStandardMaterial({map:tex(64,16,(c,w,h)=>{for(let x=0;x<8;x++)for(let y=0;y<2;y++){c.fillStyle=(x+y)&1?'#111':'#fff';c.fillRect(x*8,y*8,8,8)}}),side:THREE.DoubleSide}));
 sl.rotation.order='YXZ';sl.rotation.y=Math.atan2(T[0].x,T[0].z);sl.rotation.x=-Math.PI/2;sl.position.set(P[0].x,.08,P[0].z);world.add(sl);
 const D=new THREE.Object3D(),C=new THREE.Color();

 setTimeout(()=>{const mp=multiOn;race='menu';tab='';$('hud').style.display=$('spd').style.display=$('ctl').style.display='none';
  show('<h2>'+(place===1?'🏆 You won!':'Finished '+place+'/'+cars.length)+'</h2><p>Time '+fmt(t)+(nb?' · new best!':'')+'</p><p>🪙 +'+rw+' (100 for racing + bonus)</p>'+(mp?'<button class="m o" onclick="backLobby()">Back to lobby</button>':'<button class="m o" onclick="startRace('+L+')">Race again</button>'+(L+1<LV.length&&save.unlocked>L+1?'<button class="m" onclick="startRace('+(L+1)+')">Next world</button>':''))+'<br><button class="m g" onclick="'+(mp?'leave()':'home()')+'">Menu</button>')},1500)}
let db=null,user=null,uid=null,lbDocs=[],grp={code:'',host:0,w:0,sn:0},lastSt=0,joinedAt=0;
let tab='',showCar=null,plat=null,gview=0,gsel=0,pausedFrom='race';
const show=(h,bot)=>{$('scr').innerHTML=h;$('ov').className=bot?'bot':'';$('ov').style.display='flex';gview=!!bot;if(!bot)hidePreview();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab))};
function previewCar(i){if(showCar)scene.remove(showCar.g);const d=CARS[i];showCar=mkCar(d,d.c);showCar.g.position.set(0,.2,0);showCar.g.rotation.y=.6;
 if(!plat){plat=new THREE.Group();const dk=new THREE.Mesh(new THREE.CylinderGeometry(4.2,4.5,.3,48),new THREE.MeshStandardMaterial({color:0x1b2238,metalness:.6,roughness:.35})),rg=new THREE.Mesh(new THREE.TorusGeometry(4.2,.08,8,64),new THREE.MeshBasicMaterial({color:0x19d8ff}));rg.rotation.x=Math.PI/2;rg.position.y=.2;dk.position.y=.05;plat.add(dk,rg);scene.add(plat)}
 plat.visible=true;plat.children[1].material.color.set(d.c)}
function hidePreview(){if(showCar){scene.remove(showCar.g);showCar=null}if(plat)plat.visible=false}
function quitRace(){race='menu';['hud','spd','ctl'].forEach(i=>$(i).style.display='none');cars.forEach(c=>scene.remove(c.g));proj.forEach(p=>scene.remove(p.m));proj=[];cars=[];$('msg').textContent='';if(multiOn&&rm)rm.presence({x:null,fn:0});multiOn=false}
function go(d){if(race!=='menu')quitRace();if(d==='h')home();else if(d==='g')garage();else if(rm)lobby();else levels()}
function pause(){if(race!=='race'&&race!=='count')return;tab='';
 if(multiOn){show('<h2>Leave the race?</h2><button class="m g" onclick="$(\'ov\').style.display=\'none\'">Keep racing</button><button class="m o" onclick="go(\'p\')">Back to lobby</button>');return}
 pausedFrom=race;race='paused';show('<h2>Paused</h2><button class="m o" onclick="resume()">Resume</button><br><button class="m" onclick="startRace('+curLv+')">Restart</button><button class="m g" onclick="go(\'h\')">Home</button>')}
function resume(){$('ov').style.display='none';race=pausedFrom}
$('pz').addEventListener('pointerdown',e=>e.stopPropagation());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function home(){tab='h';lobbyOn=0;show('<h1>Turbo Rush</h1><p>Race, crash, grab 🎁, earn coins, buy new cars.</p><input id="nm" maxlength="14" placeholder="Your racer name" value="'+esc(save.name||'')+'"><p class="sm">'+(uid?'Signed in – your times go on the global leaderboard.':'Open in claude.ai to use the global leaderboard. Progress is saved on this device.')+'</p><button class="m o" onclick="nm();levels()">Solo race</button><br><button class="m" onclick="nm();groupMenu()">Play with friends</button><br><button class="m" onclick="nm();board(0)">Leaderboard</button><p class="sm">🚗 '+CARS[save.car].n+' · 🪙'+save.coins+'</p>')}
const nm=()=>{const v=$('nm');if(v){save.name=v.value.trim().slice(0,14);persist()}};
function levels(){tab='p';show('<h2>Choose world</h2>'+LV.map((l,i)=>i<save.unlocked?'<div class="row"><span><b>'+(i+1)+'. '+l.n+'</b><br><span class="sm">'+l.laps+' laps · best '+fmt(save.best[i])+'</span></span><button class="m o" onclick="startRace('+i+')">Go</button></div>':'<div class="row"><span>🔒 '+(i+1)+'. '+l.n+'</span><span class="sm">top 3 on the last world</span></div>').join('')+'<button class="m g" onclick="home()">Back</button>')}
function garage(i){tab='g';if(i==null||i!==i)i=save.car;gsel=(i+CARS.length)%CARS.length;const c=CARS[gsel],t=c.s,own=save.own.includes(gsel);previewCar(gsel);
 const bar=(l,v,mx)=>'<div class="st"><span>'+l+'</span><i><b style="width:'+Math.min(100,v/mx*100)+'%"></b></i></div>';
 show('<div class="gh"><button class="m g" onclick="garage('+(gsel-1)+')">◀</button><h2>'+c.n+'</h2><button class="m g" onclick="garage('+(gsel+1)+')">▶</button></div><p class="sm">'+c.d+'</p>'+bar('Speed',t.sp,1.65)+bar('Accel',t.ac,1.6)+bar('Handling',t.hd,1.55)+bar('Weight',t.m,3)+
  '<p>'+(save.car===gsel?'✅ Your car':own?'Owned':'🪙 '+c.p)+' <span class="sm">· you have 🪙'+save.coins+'</span></p>'+(save.car===gsel?'':own?'<button class="m o" onclick="pickCar('+gsel+')">Use this car</button>':'<button class="m o" onclick="pickCar('+gsel+')">Buy for 🪙'+c.p+'</button>'),true)}
function pickCar(i){if(!save.own.includes(i)){if(save.coins<CARS[i].p){toast('Not enough coins');return}save.coins-=CARS[i].p;save.own.push(i)}save.car=i;persist();if(rm)rm.presence({car:i});garage(i)}
function groupMenu(){tab='p';show('<h2>Play with friends</h2>'+(ROOM?'<p class="sm">Friends need to open this link in claude.ai.</p><button class="m o" onclick="mkGroup()">Create group</button><p>or enter a code</p><input id="cd" maxlength="4" placeholder="CODE" style="text-transform:uppercase;width:50%"><br><button class="m" onclick="joinCode()">Join</button>':'<p>Group racing needs this page opened inside claude.ai (signed in).</p>')+'<br><button class="m g" onclick="home()">Back</button>')}
const mkGroup=()=>joinGroup(Array.from({length:4},()=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.random()*31|0]).join(''),1);
function joinCode(){const c=($('cd').value||'').trim().toUpperCase();if(c.length!==4){toast('Enter the 4-letter code');return}joinGroup(c,0)}
async function joinGroup(code,host){try{rm=await ROOM.join('tr-'+code)}catch(e){toast('Could not join');return}
 grp={code,host,w:0,sn:0};lastSt=0;joinedAt=Date.now();multiOn=false;
 await rm.presence({n:save.name||'Racer',car:save.car,h:host?1:0,w:0,st:0,x:null,fn:0});rm.onPeers(onPeers);lobbyOn=1;lobby()}
const hostW=()=>{const h=rm.peers().find(p=>p.presence.h===1);return h?(h.presence.w|0):0};
function lobby(){if(!rm)return;tab='p';lobbyOn=1;const ps=rm.peers(),w=grp.host?grp.w:hostW();
 show('<h2>Group '+grp.code+'</h2><p class="sm">Share this code with friends</p>'+ps.map(p=>'<div class="row"><span><i class="sw" style="background:#'+hex((CARS[p.presence.car|0]||CARS[0]).c)+'"></i>'+esc(p.presence.n||'Racer')+(p.presence.h?' 👑':'')+(p.isMe?' (you)':'')+'</span></div>').join('')+
 (grp.host?'<p>Pick the world:</p>'+LV.map((l,i)=>'<button class="m '+(i===w?'':'g')+'" style="padding:4px 12px;font-size:15px" onclick="setW('+i+')">'+(i+1)+'</button>').join('')+'<p class="sm">'+LV[w].n+'</p><button class="m o" onclick="hostStart()">Start race</button>':'<p>World: <b>'+LV[w].n+'</b></p><p class="sm">Waiting for the host to start…</p>')+'<br><button class="m g" onclick="leave()">Leave group</button>')}
function setW(i){grp.w=i;rm.presence({w:i});lobby()}
function hostStart(){grp.sn++;lastSt=grp.sn;rm.presence({w:grp.w,st:grp.sn});startRace(grp.w,true)}
function onPeers(){if(!rm)return;if(lobbyOn&&race==='menu')lobby();const h=rm.peers().find(p=>p.presence.h===1&&!p.isMe);
 if(h){const st=h.presence.st|0;if(st>lastSt){lastSt=st;if(Date.now()-joinedAt>2000&&race==='menu')startRace(h.presence.w|0,true)}}}
function backLobby(){if(rm)rm.presence({x:null,fn:0,rk:null});multiOn=false;lobby()}
function leave(){try{rm.presence({n:null,x:null,h:0});rm.leave()}catch(e){}rm=null;lobbyOn=0;multiOn=false;home()}
async function board(l){tab='';let rows=[];
 if(db){const ids=lbDocs.filter(d=>d.t&&d.t[l]!=null).sort((a,b)=>a.t[l]-b.t[l]).slice(0,10);let pr={};try{pr=await user.profiles(ids.map(d=>d.id))}catch(e){}
  rows=ids.map((d,i)=>'<div class="row"><span>'+(i+1)+'. '+esc(d.nick||(pr[d.id]&&pr[d.id].name)||'Racer')+(d.id===uid?' (you)':'')+'</span><b>'+fmt(d.t[l])+'</b></div>')}
 else rows=save.best[l]!=null?['<div class="row"><span>1. '+esc(save.name||'You')+' (you)</span><b>'+fmt(save.best[l])+'</b></div>']:[];
 show('<h2>Leaderboard</h2><p>'+LV.map((_,i)=>'<button class="m '+(i===l?'':'g')+'" style="padding:4px 12px;font-size:15px" onclick="board('+i+')">'+(i+1)+'</button>').join('')+'</p><p class="sm">'+LV[l].n+(db?'':' · local only')+'</p>'+(rows.join('')||'<p>No times yet – go set one!</p>')+'<button class="m g" onclick="home()">Back</button>')}
function submit(){if(db&&uid)db.collection('scores').doc(uid).set({nick:save.name||'Racer',t:save.best}).catch(()=>{})}
(async()=>{if(!window.claude)return;const to=p=>Promise.race([p,new Promise(r=>setTimeout(()=>r(null),4000))]);
 try{ROOM=await to(claude.use('room'))}catch(e){}
 try{user=await to(claude.use('user'));db=await to(claude.use('db'));
  if(user&&db){uid=await user.id();if(!uid){db=null}else{if(!save.name){const me=await user.me();if(me&&me.name){save.name=me.name.slice(0,14);persist()}}
   db.collection('scores').onSnapshot(s=>{lbDocs=s.docs.map(d=>Object.assign({id:d.id},d.data()))},()=>{})}}else db=null}catch(e){db=null}
 if(race==='menu'&&!lobbyOn&&$('nm'))home()})();

// ---- loop
build(LV[0]);cars=[];
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-lastT)/1000);lastT=now;partsUpd(dt);
 if(race==='paused'){}else if(race!=='menu')step(dt);else{perf+=dt;const a=perf*.12;boxes.forEach(b=>b.g.rotation.y+=dt);
  if(gview){const b=perf*.5;cam.position.set(Math.sin(b)*9.5,3.3,Math.cos(b)*9.5);cam.lookAt(0,1,0);cam.fov=48;sun.position.set(SUNV.x*70,SUNV.y*70+10,SUNV.z*70);sun.target.position.set(0,0,0)}
  else{cam.position.set(Math.sin(a)*170,55,Math.cos(a)*170);cam.lookAt(0,0,0);cam.fov=62}cam.updateProjectionMatrix()}
 dome.position.copy(cam.position);starsM.position.copy(cam.position);sunD.position.copy(cam.position).addScaledVector(SUNV,650);
 if(comp)comp.render();else ren.render(scene,cam)}
home();requestAnimationFrame(loop);
</script>
</body>
